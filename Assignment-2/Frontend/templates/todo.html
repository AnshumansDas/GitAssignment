<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do Form</title>
    </head>
    <body>
        <div class="centered">
            <form action="/submit" method="POST">
                <table>
                    <tr>
                        <td><label for="itemId">Item ID:</label></td>
                        <td><input type="text" id="itemID" name="itemID" placeholder="Enter Item ID" required></td>
                    </tr>
                    <tr>
                        <td><label for="itemname">Item Name:</label></td>
                        <td><input type="text" id="itemName" name="itemName" placeholder="Enter Item Name" required></td>
                    </tr>
                    <tr>
                        <td><label for="description">Description:</label></td>
                        <td><input type="text" id="itemDescrption" name="itemDescription" placeholder="Enter Item Description" required></td>
                    </tr>
                    <tr>
                        <td><input type="submit" value="Save"></td>
                        <td></td>
                    </tr>
                </table>
            </form>
            <a href="getdata"><button>View Data</button></a>
        </div>
    </body>
    <style>
        body{
            background-color: #f2f2f2;
        }
        p{
            font-size: 20px;
            text-align: center;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .centered {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
        }
    </style>
</html>
